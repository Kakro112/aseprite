name: build-personal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - uses: aseprite/get-ninja@main

    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Building
      shell: bash
      run: |
        bash build.sh --auto --norun

    - name: Show DLL dependencies
      shell: cmd
      run: |
        dumpbin /dependents build\bin\aseprite.exe

    - name: Bundle OpenSSL DLLs
      shell: pwsh
      run: |
        $roots = @(
          "C:\Program Files\OpenSSL*",
          "C:\Program Files\Git\mingw64\bin",
          "C:\Windows\System32"
        )
        $dlls = foreach ($r in $roots) {
          Get-ChildItem $r -Recurse -ErrorAction SilentlyContinue -Include "libcrypto-3*.dll","libssl-3*.dll"
        }
        if (-not $dlls) { Write-Error "No OpenSSL DLLs found"; exit 1 }
        $dlls | Sort-Object Name -Unique | ForEach-Object {
          Write-Host "Copying $($_.FullName)"
          Copy-Item $_.FullName build\bin\
        }

    - uses: actions/upload-artifact@v4
      with:
        name: aseprite-windows
        path: build/bin
        retention-days: 1
